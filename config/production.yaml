# OctoMaster Pro - Production Configuration
# Override settings for production environment

# Application Settings
app:
  debug: false
  log_level: "WARNING"

# Database Configuration
database:
  url: "postgresql://user:pass@localhost/octomaster"
  echo: false
  pool_size: 20
  max_overflow: 40

# Browser Configuration
browser:
  headless: true  # Run headless in production
  timeout: 45000

# AI Assistant Configuration
ai:
  enabled: true
  temperature: 0.7

# Scheduler Configuration
scheduler:
  enabled: true
  max_workers: 10

# Workflow Configuration
workflow:
  auto_save: true
  auto_save_interval: 120
  max_execution_time: 600
  max_retries: 5
  retry_delay: 5

# Performance Configuration
performance:
  cache_enabled: true
  cache_size_mb: 500
  max_concurrent_tasks: 20

# Security Configuration
security:
  encrypt_credentials: true
  secure_storage: true
  password_required: true

# UI Configuration
ui:
  show_tips: false
  confirm_delete: true

# Logging Configuration
logging:
  rotation: "500 MB"
  retention: "30 days"
  compression: "zip"
  colorize: false
  backtrace: false  # Don't expose internals
  diagnose: false

# Network Configuration
network:
  timeout: 45
  max_retries: 5
  verify_ssl: true
