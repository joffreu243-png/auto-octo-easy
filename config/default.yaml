# OctoMaster Pro - Default Configuration
# This file contains default settings for the application

# Application Settings
app:
  name: "OctoMaster Pro"
  version: "1.0.0-alpha"
  debug: false
  log_level: "INFO"

# Directories
directories:
  data: "data"
  logs: "logs"
  plugins: "plugins"
  templates: "templates"
  downloads: "downloads"
  screenshots: "screenshots"

# Database Configuration
database:
  url: "sqlite:///data/octomaster.db"
  echo: false
  pool_size: 5
  max_overflow: 10

# Browser Configuration
browser:
  default: "chromium"  # chromium, firefox, webkit, chrome, edge
  headless: false
  timeout: 30000  # milliseconds
  viewport:
    width: 1920
    height: 1080
  user_agent: null  # null for default

  # WebEngine settings (embedded browser)
  webengine:
    gpu_enabled: false  # Disable for VMs
    javascript_enabled: true
    plugins_enabled: false

# AI Assistant Configuration
ai:
  enabled: false  # Set to true to enable AI features
  provider: "openai"  # openai, anthropic
  api_key: null  # Set via environment variable: AI__API_KEY
  model: "gpt-4"
  temperature: 0.7
  max_tokens: 2000

# Octo Browser Integration
octo:
  enabled: false
  api_url: "http://localhost:58888"
  api_key: null  # Set via environment variable: OCTO__API_KEY
  timeout: 30

# Scheduler Configuration
scheduler:
  enabled: true
  timezone: "UTC"
  max_workers: 4

# Notifications Configuration
notifications:
  enabled: true

  # Email
  email:
    enabled: false
    smtp_host: null
    smtp_port: 587
    smtp_user: null
    smtp_password: null  # Set via environment variable
    from_address: null
    to_address: null

  # Telegram
  telegram:
    enabled: false
    bot_token: null  # Set via environment variable
    chat_id: null

  # Slack
  slack:
    enabled: false
    webhook_url: null  # Set via environment variable

  # Discord
  discord:
    enabled: false
    webhook_url: null  # Set via environment variable

  # Desktop Notifications
  desktop:
    enabled: true

# Workflow Configuration
workflow:
  auto_save: true
  auto_save_interval: 60  # seconds
  max_execution_time: 300  # seconds
  max_retries: 3
  retry_delay: 2  # seconds

# Recording Configuration
recorder:
  max_actions: 1000
  capture_screenshots: false
  screenshot_on_action: false

# Plugin Configuration
plugins:
  enabled: true
  auto_load: true
  allowed_plugins: []  # empty = all allowed

# Performance Configuration
performance:
  cache_enabled: true
  cache_size_mb: 100
  max_concurrent_tasks: 5

# Security Configuration
security:
  encrypt_credentials: true
  secure_storage: true
  password_required: false

# UI Configuration
ui:
  theme: "dark"  # light, dark, auto
  language: "ru"  # ru, en
  show_tips: true
  confirm_delete: true
  recent_files_count: 10

# Logging Configuration
logging:
  rotation: "100 MB"
  retention: "10 days"
  compression: "zip"
  colorize: true
  backtrace: true
  diagnose: true

# Network Configuration
network:
  timeout: 30
  max_retries: 3
  verify_ssl: true
  proxy: null  # http://user:pass@host:port
