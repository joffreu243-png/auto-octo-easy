[tool.poetry]
name = "octomaster-pro"
version = "1.0.0-alpha"
description = "Advanced browser automation platform with visual workflow builder, AI assistant, and Octo Browser integration"
authors = ["OctoMaster Team <support@octomaster.pro>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/octomaster/octomaster-pro"
repository = "https://github.com/octomaster/octomaster-pro"
documentation = "https://docs.octomaster.pro"
keywords = ["automation", "browser", "playwright", "selenium", "workflow", "visual-editor", "ai", "octo-browser"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Environment :: X11 Applications :: Qt",
]
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"

# GUI Framework
PyQt6 = "^6.6.0"
PyQt6-WebEngine = "^6.6.0"
PyQt6-QScintilla = "^2.14.0"
pyqtgraph = "^0.13.3"

# Browser Automation
playwright = "^1.40.0"
selenium = "^4.16.0"
selenium-wire = "^5.1.0"
pyppeteer = "^2.0.0"

# Web & HTTP
httpx = "^0.25.2"
aiohttp = "^3.9.1"
requests = "^2.31.0"
beautifulsoup4 = "^4.12.2"
lxml = "^4.9.3"
html5lib = "^1.1"

# Data Processing & Formats
pandas = "^2.1.4"
openpyxl = "^3.1.2"
xlrd = "^2.0.1"
python-docx = "^1.1.0"
pypdf2 = "^3.0.1"
python-dotenv = "^1.0.0"
pyyaml = "^6.0.1"
toml = "^0.10.2"
jsonschema = "^4.20.0"

# Database
sqlalchemy = "^2.0.23"
alembic = "^1.13.0"
aiosqlite = "^0.19.0"
psycopg2-binary = "^2.9.9"

# Scheduling & Async Tasks
apscheduler = "^3.10.4"
celery = "^5.3.4"
redis = "^5.0.1"

# AI Integration
openai = "^1.6.1"
anthropic = "^0.8.0"
tiktoken = "^0.5.2"
langchain = "^0.1.0"
langchain-community = "^0.0.10"

# Logging & Monitoring
loguru = "^0.7.2"
sentry-sdk = "^1.39.1"
colorama = "^0.4.6"

# Notifications
python-telegram-bot = "^20.7"
slack-sdk = "^3.26.1"
discord-webhook = "^1.3.0"
smtplib-starttls = {version = "*", python = "^3.11", optional = true}

# Data Validation & Serialization
pydantic = "^2.5.2"
pydantic-settings = "^2.1.0"
attrs = "^23.1.0"
cattrs = "^23.2.3"
marshmallow = "^3.20.1"

# Date & Time
python-dateutil = "^2.8.2"
pytz = "^2023.3"
croniter = "^2.0.1"
arrow = "^1.3.0"

# Cryptography & Security
cryptography = "^41.0.7"
pyjwt = "^2.8.0"
bcrypt = "^4.1.2"

# CLI & UI
click = "^8.1.7"
rich = "^13.7.0"
typer = "^0.9.0"
questionary = "^2.0.1"

# Image & Media Processing
pillow = "^10.1.0"
opencv-python-headless = "^4.9.0"

# Utilities
more-itertools = "^10.1.0"
boltons = "^23.1.1"
toolz = "^0.12.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
pytest-qt = "^4.2.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"
pytest-xdist = "^3.5.0"
black = "^23.12.0"
isort = "^5.13.2"
flake8 = "^6.1.0"
mypy = "^1.7.1"
pylint = "^3.0.3"
ruff = "^0.1.8"
pre-commit = "^3.6.0"
sphinx = "^7.2.6"
sphinx-rtd-theme = "^2.0.0"
sphinx-autodoc-typehints = "^1.25.2"
ipython = "^8.18.1"
ipdb = "^0.13.13"

[tool.poetry.extras]
dev = ["pytest", "black", "isort", "flake8", "mypy", "pylint"]
ai-advanced = ["torch", "transformers"]
all = ["dev", "ai-advanced"]

[tool.poetry.scripts]
octomaster = "src.core.app:main"
octomaster-cli = "src.cli.main:cli_main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

# Black Configuration
[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | build
  | dist
  | __pycache__
)/
'''

# isort Configuration
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true

# MyPy Configuration
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true
strict_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "playwright.*",
    "selenium.*",
    "PyQt6.*",
    "bs4.*",
    "pandas.*",
]
ignore_missing_imports = true

# Pytest Configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --cov=src --cov-report=term-missing --cov-report=html --cov-report=xml"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "gui: marks tests as GUI tests",
    "async: marks tests as async tests",
]
asyncio_mode = "auto"

# Pylint Configuration
[tool.pylint.messages_control]
disable = [
    "C0330",
    "C0326",
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.basic]
good-names = ["i", "j", "k", "ex", "Run", "_", "id", "x", "y"]

# Coverage Configuration
[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
    "class .*\\bProtocol\\):",
    "@overload",
]
precision = 2
show_missing = true

# Ruff Configuration
[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "W505",  # doc line too long
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/**/*.py" = ["S101"]  # Allow assert in tests
